name: VPN (WireGuard) run

on:
  workflow_dispatch:

jobs:
  run-vpn:
    name: Run WireGuard VPN connect and monitor
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@v4

      - name: Install system packages (wireguard-tools, resolvconf, python3, pip, jq, curl)
        timeout-minutes: 5
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          sudo apt-get update -y
          sudo apt-get install -y wireguard-tools resolvconf python3 python3-pip jq curl
          wg --version || true
          resolvconf --version || true
          python3 --version || true
          jq --version || true
          curl --version || true
        shell: bash

      - name: Install Python deps (requests)
        timeout-minutes: 5
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          python3 -m pip install --upgrade pip
          python3 -m pip install requests
        shell: bash

      - name: Diagnostico do ambiente antes de correr o script
        timeout-minutes: 2
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          echo "--- Interfaces de rede atuais ---"
          ip addr show
          echo "--- /dev/net/tun ---"
          ls -l /dev/net/tun || echo "AUSENTE"
          echo "--- Modulo wireguard no kernel ---"
          lsmod | grep wireguard || echo "modulo wireguard nao carregado (normal, userspace trata disso)"
          echo "--- Resolvconf ---"
          which resolvconf || echo "resolvconf nao encontrado no PATH"
          echo "--- Espaco em disco ---"
          df -h /
        shell: bash

      - name: Run vpn_connect.py with sudo (unbuffered, detailed logs)
        timeout-minutes: 355
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          echo "=== INICIO $(date -u) ==="
          sudo -E python3 -u vpn_connect.py
          echo "=== FIM $(date -u) ==="
        shell: bash
