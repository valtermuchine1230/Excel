name: VPN (WireGuard) run

on:
  workflow_dispatch:

jobs:
  run-vpn:
    name: Run WireGuard VPN connect and monitor
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages (wireguard-tools, resolvconf, python3, pip, jq, curl)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          sudo apt-get update -y
          # Install wireguard tools and helpers
          sudo apt-get install -y wireguard resolvconf python3 python3-pip jq curl iproute2
          # show versions
          which wg-quick || true
          wg --version || true
          wg-quick --version || true 2>/dev/null || true
          resolvconf --version || true
          python3 --version || true
          jq --version || true
          curl --version || true
        shell: bash

      - name: Debug environment (verify /dev/net/tun and sudo non-interactive)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          echo "Checking /dev/net/tun:"
          ls -l /dev/net/tun || echo "/dev/net/tun not present"
          echo "Which wg-quick:"
          which wg-quick || true
          echo "wg / ip versions:"
          wg --version || true
          ip -V || true
          echo "sudo non-interactive check:"
          sudo -n true && echo "sudo non-interactive OK" || echo "sudo may prompt or not allowed"
          echo "Current user:"
          id -a || true
        shell: bash

      - name: Install Python deps (requests)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          python3 -m pip install --upgrade pip
          python3 -m pip install requests
        shell: bash

      - name: Show /etc/wireguard dir (pre-run)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          sudo ls -la /etc/wireguard || echo "/etc/wireguard not present yet"
        shell: bash

      - name: Run vpn_connect.py with sudo (detailed logs)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          echo "Running vpn_connect.py with sudo - will run until cancelled or job timeout of 360 minutes"
          # Use -E to preserve environment if needed, -u for unbuffered python stdout
          sudo -E python3 -u vpn_connect.py
        shell: bash
