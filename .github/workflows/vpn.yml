name: VPN (WireGuard) run - show IPs

on:
  workflow_dispatch:

jobs:
  run-vpn:
    name: Run WireGuard VPN connect and show IPs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages (wireguard-tools, resolvconf, python3, pip, jq, curl, iproute2)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          sudo apt-get update -y
          sudo apt-get install -y wireguard resolvconf python3 python3-pip jq curl iproute2
          # ensure ping is available
          sudo apt-get install -y iputils-ping || true
          which wg-quick || true
          wg --version || true
          wg-quick --version || true 2>/dev/null || true
        shell: bash

      - name: Debug environment (concise)
        run: |
          set -x
          echo "User info:"; id -a || true
          echo "/dev/net/tun:"; ls -l /dev/net/tun || echo "/dev/net/tun missing"
          echo "sudo non-interactive:"; sudo -n true && echo "ok" || echo "may prompt"
          echo "wg-quick location:"; which wg-quick || true
          echo "wg version:"; wg --version || true
        shell: bash

      - name: Show public IPs (before VPN)
        run: |
          set -x
          echo "Public IPv4 (pre-VPN):"
          curl -4 --fail -sS https://api.ipify.org?format=json || echo "IPv4 query failed"
          echo "Public IPv6 (pre-VPN):"
          curl -6 --fail -sS https://api64.ipify.org?format=json || echo "IPv6 query failed or not available"
        shell: bash

      - name: Install Python deps (requests)
        run: |
          set -x
          python3 -m pip install --upgrade pip
          python3 -m pip install requests
        shell: bash

      - name: Run vpn_connect.py with sudo (pretty logs)
        run: |
          set -x
          echo "Starting vpn_connect.py (this will keep running until you cancel or the job times out at 360 minutes)..."
          # unbuffered Python so logs are streamed
          sudo -E python3 -u vpn_connect.py
        shell: bash
