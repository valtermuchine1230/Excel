name: VPN (WireGuard) run

on:
  workflow_dispatch:

jobs:
  run-vpn:
    name: Run WireGuard VPN connect and monitor
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages (wireguard-tools, resolvconf, python3, pip, jq, curl)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          sudo apt-get update -y
          sudo apt-get install -y wireguard-tools resolvconf python3 python3-pip jq curl
          # show versions
          wg --version || true
          resolvconf --version || true
          python3 --version || true
          jq --version || true
          curl --version || true
        shell: bash

      - name: Install Python deps (requests)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          python3 -m pip install --upgrade pip
          python3 -m pip install requests
        shell: bash

      - name: Run vpn_connect.py with sudo (detailed logs)
        run: |
          export PS4='+ $(date -u "+%Y-%m-%dT%H:%M:%S%z") '
          set -x
          echo "Running vpn_connect.py with sudo (will run until cancelled or job timeout of 360 minutes):"
          sudo python3 vpn_connect.py
        shell: bash
